name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      release_body: ${{ steps.release_notes.outputs.body }}
      release_draft: ${{ steps.release_notes.outputs.release_draft }}
    steps:
      - uses: actions/checkout@v4

      - name: Read release notes from changelog
        id: release_notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $tag = "v$version"
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $escapedVersion = [regex]::Escape($version)
          $match = [regex]::Match($changelog, "(?ms)^## \[$escapedVersion\].*?\r?\n(.*?)(?=^---\s*$)")
          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain release notes for $version"
          }
          "body<<LIGHTTODO_RELEASE_NOTES" >> $env:GITHUB_OUTPUT
          $match.Groups[1].Value.Trim() >> $env:GITHUB_OUTPUT
          "LIGHTTODO_RELEASE_NOTES" >> $env:GITHUB_OUTPUT

          $release = gh release view $tag --json isDraft 2> $null | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            $notesPath = Join-Path $env:RUNNER_TEMP "lighttodo-release-notes.md"
            [System.IO.File]::WriteAllText(
              $notesPath,
              $match.Groups[1].Value.Trim(),
              [System.Text.UTF8Encoding]::new($false)
            )
            gh release create $tag --draft --title $tag --notes-file $notesPath
            $releaseDraft = "true"
          } else {
            $releaseDraft = $release.isDraft.ToString().ToLowerInvariant()
          }
          "release_draft=$releaseDraft" >> $env:GITHUB_OUTPUT

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows updater
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: ${{ needs.prepare.outputs.release_body }}
          releaseDraft: ${{ needs.prepare.outputs.release_draft }}
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis

  build-macos:
    needs: prepare
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: Apple Silicon
          - target: x86_64-apple-darwin
            name: Intel
    env:
      APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed macOS ${{ matrix.name }} app and DMG
        if: env.APPLE_SIGNING_ENABLED == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: ${{ needs.prepare.outputs.release_body }}
          releaseDraft: ${{ needs.prepare.outputs.release_draft }}
          prerelease: false
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles app,dmg

      - name: Build unsigned macOS ${{ matrix.name }} app and DMG
        if: env.APPLE_SIGNING_ENABLED != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: ${{ needs.prepare.outputs.release_body }}
          releaseDraft: ${{ needs.prepare.outputs.release_draft }}
          prerelease: false
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles app,dmg

  build-android:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Allow Gradle wrapper execution
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Android release signing secrets are incomplete" >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/lighttodo-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Android APK
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: ${{ needs.prepare.outputs.release_body }}
          releaseDraft: ${{ needs.prepare.outputs.release_draft }}
          prerelease: false
          uploadUpdaterJson: false
          mobile: android
          args: --apk --split-per-abi

  finalize-release:
    needs: [build-windows, build-macos, build-android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add macOS updater targets and route downloads through gh-proxy.com
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $tag = "v$version"
          gh release download $tag --pattern latest.json --output latest.json --clobber

          $release = gh release view $tag --json assets | ConvertFrom-Json
          $universalApks = @($release.assets | Where-Object { $_.name -match '_universal\.apk$' })
          foreach ($asset in $universalApks) {
            gh release delete-asset $tag $asset.name --yes
          }

          function Get-MacPlatform($archivePattern, $signaturePath) {
            $updater = @($release.assets | Where-Object { $_.name -match $archivePattern })
            if ($updater.Count -ne 1) {
              throw "Expected exactly one macOS updater archive matching $archivePattern"
            }
            $signatureAssetName = "$($updater[0].name).sig"
            $signatureAsset = @($release.assets | Where-Object { $_.name -eq $signatureAssetName })
            if ($signatureAsset.Count -ne 1) {
              throw "Expected signature asset $signatureAssetName"
            }
            gh release download $tag --pattern $signatureAssetName --output $signaturePath --clobber
            $signature = (Get-Content $signaturePath -Raw -Encoding utf8).Trim()
            $assetName = [uri]::EscapeDataString($updater[0].name)
            return [ordered]@{
              signature = $signature
              url = "https://gh-proxy.com/github.com/zhtdbobo/LightTodo/releases/download/$tag/$assetName"
            }
          }

          $macArmPlatform = Get-MacPlatform '(?i)(aarch64|arm64).*\.app\.tar\.gz$' 'macos-arm64-updater.sig'
          $macX64Platform = Get-MacPlatform '(?i)(x64|x86_64).*\.app\.tar\.gz$' 'macos-x64-updater.sig'

          $universalMacAssets = @($release.assets | Where-Object {
            $_.name -match '(?i)universal\.(dmg|app\.tar\.gz(\.sig)?)$'
          })
          foreach ($asset in $universalMacAssets) {
            gh release delete-asset $tag $asset.name --yes
          }

          $manifest = Get-Content latest.json -Raw -Encoding utf8 | ConvertFrom-Json
          $manifest.platforms | Add-Member -NotePropertyName "darwin-aarch64" -NotePropertyValue $macArmPlatform -Force
          $manifest.platforms | Add-Member -NotePropertyName "darwin-x86_64" -NotePropertyValue $macX64Platform -Force
          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            $platform.Value.url = $platform.Value.url -replace '^https://github\.com/', 'https://gh-proxy.com/github.com/'
          }
          $json = $manifest | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "latest.json"),
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )
          gh release upload $tag latest.json --clobber
          # Publish only after every platform asset and latest.json are ready.
          gh release edit $tag --draft=false
