name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release notes from changelog
        id: release_notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $escapedVersion = [regex]::Escape($version)
          $match = [regex]::Match($changelog, "(?ms)^## \[$escapedVersion\].*?\r?\n(.*?)(?=^---\s*$)")
          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain release notes for $version"
          }
          "body<<LIGHTTODO_RELEASE_NOTES" >> $env:GITHUB_OUTPUT
          $match.Groups[1].Value.Trim() >> $env:GITHUB_OUTPUT
          "LIGHTTODO_RELEASE_NOTES" >> $env:GITHUB_OUTPUT

      - name: Build signed updater and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Route updater downloads through gh-proxy.com
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $tag = "v$version"
          gh release download $tag --pattern latest.json --output latest.json --clobber
          $manifest = Get-Content latest.json -Raw -Encoding utf8 | ConvertFrom-Json
          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            $platform.Value.url = $platform.Value.url -replace '^https://github\.com/', 'https://gh-proxy.com/github.com/'
          }
          $json = $manifest | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "latest.json"),
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )
          gh release upload $tag latest.json --clobber
